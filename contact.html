<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Taste of Africa: a celebration of African cuisine.">
<title>Contact | Taste of Africa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="site-header">
  <a class="logo" href="index.html">Taste<span>of</span>Africa</a>
  <nav aria-label="Main navigation"><ul><li><a href="index.html">Home</a></li><li><a href="recipes.html">Recipes</a></li><li><a href="west-africa.html">West</a></li><li><a href="east-africa.html">East</a></li><li><a href="north-africa.html">North</a></li><li><a href="about.html">About</a></li><li><a href="contact.html" aria-current="page">Contact</a></li></ul></nav>
  <button id="themeToggle" class="icon-btn" aria-label="Toggle dark and light mode">🌙</button>
</header>
<main>
<section class="wrap narrow"><h1>Contact Us</h1>
<form id="contactForm" novalidate>
<label for="name">Name</label><input type="text" id="name" required>
<label for="email">Email</label><input type="email" id="email" required>
<label for="country">Country</label><select id="country" required><option value="">Select your country</option><option>Rwanda</option><option>Nigeria</option><option>Kenya</option><option>Ghana</option><option>Ethiopia</option><option>Morocco</option><option>South Africa</option><option>Egypt</option><option>Other</option></select>
<label for="dish">Favourite African dish</label><input type="text" id="dish" list="dishes" placeholder="Start typing…"><datalist id="dishes"><option value="Jollof Rice"><option value="Injera"><option value="Tagine"><option value="Bunny Chow"><option value="Isombe"></datalist>
<label for="message">Message</label><textarea id="message" rows="5" required></textarea>
<p id="formError" class="error" role="alert"></p>
<button class="btn" type="submit">Send message</button>
</form><p id="thanks" class="thanks hidden" role="status"></p></section>
</main>
<footer class="site-footer">
  <div>
    <h2>Taste of Africa</h2>
    <p>Celebrating African food heritage, one recipe at a time.</p>
  </div>
  <form id="newsletterForm" novalidate>
    <label for="nlEmail">Join our newsletter</label>
    <div class="row"><input type="email" id="nlEmail" placeholder="you@example.com" required><button class="btn" type="submit">Subscribe</button></div>
    <p id="nlMsg" role="status"></p>
  </form>
  <p class="copy">© 2026 Taste of Africa. All rights reserved.</p>
</footer>
<script src="script.js"></script>
</body>
</html>
